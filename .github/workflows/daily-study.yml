name: Daily forecasting study collection

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecasting-study-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      STUDY_DEADLINE: ${{ secrets.STUDY_DEADLINE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      STUDY_BACKUP_REPOSITORY: ${{ secrets.STUDY_BACKUP_REPOSITORY }}
      STUDY_BACKUP_TOKEN: ${{ secrets.STUDY_BACKUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
      - name: Verify private backup target
        run: |
          if [ -z "$STUDY_BACKUP_REPOSITORY" ] || [ -z "$STUDY_BACKUP_TOKEN" ]; then
            echo "Configure STUDY_BACKUP_REPOSITORY and STUDY_BACKUP_TOKEN for private persistence." >&2
            exit 1
          fi
          if [ "$STUDY_BACKUP_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "Study data cannot be backed up to the study repository." >&2
            exit 1
          fi
          private="$(GH_TOKEN="$STUDY_BACKUP_TOKEN" gh api "repos/$STUDY_BACKUP_REPOSITORY" --jq .private)"
          if [ "$private" != "true" ]; then
            echo "Study backup target must be a private repository." >&2
            exit 1
          fi
      - name: Check out private study-state repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STUDY_BACKUP_REPOSITORY }}
          ref: study-state
          token: ${{ secrets.STUDY_BACKUP_TOKEN }}
          path: private-study-state
          persist-credentials: true
      - name: Restore prior SQLite state
        run: |
          mkdir -p data
          if [ -f private-study-state/research.sqlite ]; then
            cp private-study-state/research.sqlite data/research.sqlite
          fi
      - name: Collect daily observations
        run: |
          test -f data/study-manifest.json || { echo "Commit the frozen data/study-manifest.json before enabling collection." >&2; exit 1; }
          forecast-study collect --config config/study.json --manifest data/study-manifest.json --database data/research.sqlite
      - name: Persist SQLite state to private repository
        run: |
          cp data/research.sqlite private-study-state/research.sqlite
          git -C private-study-state config user.name "github-actions[bot]"
          git -C private-study-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C private-study-state add research.sqlite
          if git -C private-study-state diff --cached --quiet; then
            echo "No database changes to persist."
          else
            git -C private-study-state commit -m "Update study state $(date -u +%F)"
            git -C private-study-state push origin HEAD:study-state
          fi
