name: Daily forecasting study collection

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: forecasting-study-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      STUDY_DEADLINE: ${{ secrets.STUDY_DEADLINE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      STUDY_BACKUP_REPOSITORY: ${{ secrets.STUDY_BACKUP_REPOSITORY }}
      STUDY_BACKUP_TOKEN: ${{ secrets.STUDY_BACKUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
      - name: Check collection prerequisites
        id: preflight
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          errors = []
          config = None
          try:
              from forecaststudy.config import load_config
              config = load_config("config/study.json")
          except Exception as exc:
              errors.append("study config/deadline is not ready ({})".format(type(exc).__name__))

          manifest_path = Path("data/study-manifest.json")
          if not manifest_path.is_file():
              errors.append("frozen data/study-manifest.json is missing")
          elif config is not None:
              try:
                  from forecaststudy.collection import _validate_frozen_config
                  from forecaststudy.study import manifest_from_file
                  _validate_frozen_config(
                      manifest_from_file(str(manifest_path)), config
                  )
              except Exception as exc:
                  errors.append("frozen manifest is invalid or mismatched ({})".format(type(exc).__name__))

          if config is not None and config.mode == "real":
              if config.model_provider == "openai" and not os.getenv("OPENAI_API_KEY"):
                  errors.append("OPENAI_API_KEY is missing")
              if config.research_provider == "tavily" and not os.getenv("TAVILY_API_KEY"):
                  errors.append("TAVILY_API_KEY is missing")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("collection_ready={}\n".format("false" if errors else "true"))
          if errors:
              for error in errors:
                  print("::notice::Collection skipped: {}".format(error))
          else:
              print("Collection prerequisites are ready.")
          PY
      - name: Report partial private backup configuration
        if: (env.STUDY_BACKUP_REPOSITORY == '') != (env.STUDY_BACKUP_TOKEN == '')
        run: echo "::warning::Private backup needs both STUDY_BACKUP_REPOSITORY and STUDY_BACKUP_TOKEN; using workflow artifacts instead."
      - name: Verify private backup target
        id: verify-private-backup
        if: steps.preflight.outputs.collection_ready == 'true' && env.STUDY_BACKUP_REPOSITORY != '' && env.STUDY_BACKUP_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.STUDY_BACKUP_TOKEN }}
        run: |
          if [ "$STUDY_BACKUP_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "Private backup target must differ from the study repository." >&2
            exit 1
          fi
          private="$(gh api "repos/$STUDY_BACKUP_REPOSITORY" --jq .private)"
          if [ "$private" != "true" ]; then
            echo "Private backup target is not private." >&2
            exit 1
          fi
          echo "Private backup target verified."
      - name: Check out private study-state repository
        id: checkout-private-backup
        if: steps.verify-private-backup.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STUDY_BACKUP_REPOSITORY }}
          ref: study-state
          token: ${{ secrets.STUDY_BACKUP_TOKEN }}
          path: private-study-state
          persist-credentials: true
      - name: Restore SQLite state from private repository
        if: steps.checkout-private-backup.outcome == 'success' && steps.preflight.outputs.collection_ready == 'true'
        run: |
          mkdir -p data
          if [ -f private-study-state/research.sqlite ]; then
            cp private-study-state/research.sqlite data/research.sqlite
          fi
      - name: Restore SQLite state from prior workflow artifact
        if: steps.preflight.outputs.collection_ready == 'true' && steps.checkout-private-backup.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name study-state --dir data; then
              echo "Restored study-state from workflow run $run_id."
              exit 0
            fi
            rm -f data/research.sqlite
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-study.yml --branch "$GITHUB_REF_NAME" --status success --limit 10 --json databaseId --jq '.[].databaseId')
          echo "::warning::No recent study-state artifact was available; starting a new database."
      - name: Collect daily observations
        id: collect
        if: steps.preflight.outputs.collection_ready == 'true'
        run: |
          forecast-study collect --config config/study.json --manifest data/study-manifest.json --database data/research.sqlite
      - name: Persist SQLite state to private repository
        id: persist-private
        if: steps.collect.outcome == 'success' && steps.checkout-private-backup.outcome == 'success'
        continue-on-error: true
        run: |
          cp data/research.sqlite private-study-state/research.sqlite
          git -C private-study-state config user.name "github-actions[bot]"
          git -C private-study-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C private-study-state add research.sqlite
          if git -C private-study-state diff --cached --quiet; then
            echo "No database changes to persist."
          else
            git -C private-study-state commit -m "Update study state $(date -u +%F)"
            git -C private-study-state push origin HEAD:study-state
          fi
      - name: Report temporary artifact fallback
        if: steps.collect.outcome == 'success' && steps.persist-private.outcome != 'success'
        run: echo "::notice::Private persistence was unavailable; retaining SQLite state in a 90-day workflow artifact."
      - name: Upload fallback SQLite artifact
        if: steps.collect.outcome == 'success' && steps.persist-private.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: study-state
          path: data/research.sqlite
          if-no-files-found: error
          retention-days: 90
