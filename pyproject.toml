[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-market-study"
version = "0.1.0"
description = "A reproducible prospective comparison of LLM and prediction-market forecasts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.23,<3",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<1.50", "matplotlib>=3.7,<4"]
test = ["pytest>=7,<9"]
all = ["streamlit>=1.40,<1.50", "matplotlib>=3.7,<4", "pytest>=7,<9"]

[project.scripts]
forecast-study = "forecaststudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forecaststudy = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
